<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Worth Control Grid</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #f8fafc; padding: 15px; max-width: 900px; margin: 0 auto; padding-bottom: 50px; }
        h1 { text-align: center; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        .nw-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .nw-title { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .nw-val { font-size: 32px; font-weight: bold; color: #10b981; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid-layout { grid-template-columns: 1fr 1fr; } }
        
        .column-box { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 15px; }
        .column-title { font-size: 14px; font-weight: bold; color: #38bdf8; text-transform: uppercase; border-bottom: 1px solid #374151; padding-bottom: 8px; margin-bottom: 15px; letter-spacing: 1px; }
        
        .card-container { background: #1f2937; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #374151; border-left: 4px solid #ef4444; cursor: pointer; transition: all 0.2s ease; }
        .card-container:hover { background: #2d3748; border-color: #4a5568; }
        .card-container.wiped { border-left-color: #10b981; opacity: 0.7; }
        .card-container.asset { border-left-color: #0284c7; }
        .card-container.flow { border-left-color: #a855f7; }
        
        .card-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .card-meta { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        
        .bar-wrapper { background: #030712; border-radius: 6px; height: 8px; overflow: hidden; border: 1px solid #374151; margin-bottom: 4px; }
        .bar-fill { background: linear-gradient(90deg, #ef4444, #f43f5e); height: 100%; width: 100%; transition: width 0.4s ease; }
        .card-container.wiped .bar-fill { width: 0% !important; }
        .card-container.asset .bar-fill { background: linear-gradient(90deg, #0284c7, #38bdf8); }
        .card-container.flow .bar-fill { background: linear-gradient(90deg, #7c3aed, #a855f7); }
        .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #1f2937; border: 1px solid #374151; border-radius: 16px; width: 100%; max-width: 440px; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #374151; padding-bottom: 8px; }
        .modal-title { font-weight: bold; color: #38bdf8; font-size: 16px; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #030712; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #0284c7, #38bdf8); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .history-section { margin-top: 15px; border-top: 1px solid #374151; padding-top: 10px; max-height: 100px; overflow-y: auto; font-size: 13px; }
        .history-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(55, 65, 81, 0.4); }
        .del-btn { background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Net Worth Grid Engine</h1>
    <div class="subtitle">Experimental Option 2 Architecture</div>
    
    <div class="nw-box">
        <div class="nw-title">Calculated Global Net Worth</div>
        <div class="nw-val" id="nw-display">$0</div>
    </div>

    <div class="grid-layout">
        <div class="column-box">
            <div class="column-title">🏦 Wealth Generation Assets</div>
            <div id="assets-box"></div>
            
            <div class="column-title" style="margin-top:25px;">🤝 Capital Support Flow</div>
            <div id="flows-box"></div>
        </div>
        
        <div class="column-box">
            <div class="column-title">💰 Avalanche Liabilities</div>
            <div id="debts-box"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="m-title">Account Details</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group" id="due-day-group">
                <label id="due-label">Monthly Due Date Day</label>
                <input type="number" id="pay-due-day" min="1" max="31">
            </div>
            <div class="form-group">
                <label id="amt-label">Log Transaction Amount ($)</label>
                <input type="number" id="pay-amount" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="pay-date">
            </div>
            <button class="submit-btn" onclick="submitForm()">Save Metrics</button>
            <div class="history-section" id="history-list"></div>
        </div>
    </div>

    <script>
        const initialDebts = [
            { id: "c1", type: "debt", name: "1. Mission Lane Black", start: 1410, bal: 1410, apr: "33.99%", pay: 1182.33, dueDay: 5, history: [] },
            { id: "c2", type: "debt", name: "2. Mission Lane Regular", start: 2520, bal: 2520, apr: "28.74%", pay: 87.00, dueDay: 12, history: [] },
            { id: "c3", type: "debt", name: "3. Ollo Card", start: 1460, bal: 1460, apr: "27.24%", pay: 34.00, dueDay: 15, history: [] },
            { id: "c4", type: "debt", name: "4. Happen Bank Loan", start: 1720, bal: 1720, apr: "25.49%", pay: 252.00, dueDay: 18, history: [] },
            { id: "c5", type: "debt", name: "5. OneMain Financial", start: 7626, bal: 7626, apr: "24.49%", pay: 246.00, dueDay: 22, history: [] },
            { id: "c6", type: "debt", name: "6. Affirm Financing", start: 777, bal: 777, apr: "Fixed", pay: 260.00, dueDay: 1, history: [] },
            { id: "c7", type: "debt", name: "7. PayPal Credit", start: 1580, bal: 1580, apr: "Closed", pay: 30.00, dueDay: 25, history: [] },
            { id: "c8", type: "debt", name: "8. Capital One", start: 3138, bal: 3138, apr: "0% Promo", pay: 32.00, dueDay: 28, history: [] }
        ];

        const initialAssets = [
            { id: "a1", type: "asset", name: "High-Yield Savings", start: 10000, bal: 0, apr: "Cash", pay: 0, dueDay: 0, history: [] },
            { id: "a2", type: "asset", name: "Robinhood Portfolio", start: 25000, bal: 0, apr: "Stocks/Crypto", pay: 0, dueDay: 0, history: [] },
            { id: "a3", type: "asset", name: "Primary 401(k)", start: 50000, bal: 0, apr: "Pre-Tax Retirement", pay: 0, dueDay: 0, history: [] },
            { id: "a4", type: "asset", name: "Secondary 401(k)", start: 20000, bal: 0, apr: "Past Corporate Asset", pay: 0, dueDay: 0, history: [] },
            { id: "a5", type: "asset", name: "Health Savings (HSA)", start: 50000, bal: 0, apr: "Medical Wealth", pay: 0, dueDay: 0, history: [] }
        ];

        const initialFlows = [
            { id: "f1", type: "flow", name: "Family Financial Aid", start: 12000, bal: 0, apr: "$1,000/mo Aid", pay: 1000, dueDay: 1, history: [] }
        ];

        let debts = JSON.parse(localStorage.getItem('grid_debts')) || initialDebts;
        let assets = JSON.parse(localStorage.getItem('grid_assets')) || initialAssets;
        let flows = JSON.parse(localStorage.getItem('grid_flows')) || initialFlows;
        let activeId = null, activeType = null;

        function renderGrid() {
            let totalAssets = 0, totalDebts = 0;
            
            // Debts
            const dBox = document.getElementById('debts-box'); dBox.innerHTML = '';
            debts.forEach(d => {
                totalDebts += d.bal;
                const pct = d.start > 0 ? Math.round((d.bal / d.start) * 100) : 0;
                const card = document.createElement('div');
                card.className = `card-container ${d.bal <= 0 ? 'wiped' : ''}`;
                card.onclick = () => openModal(d.id, "debt");
                card.innerHTML = `<div class="card-header"><span>${d.name}</span><span style="color:#ef4444;">$${Math.round(d.bal)}</span></div>
                                  <div class="card-meta">APR: ${d.apr} | Due: Day ${d.dueDay}</div>
                                  <div class="bar-wrapper"><div class="bar-fill" style="width:${d.bal <= 0 ? 0 : pct}%;"></div></div>`;
                dBox.appendChild(card);
            });

            // Assets
            const aBox = document.getElementById('assets-box'); aBox.innerHTML = '';
            assets.forEach(a => {
            
totalAssets += a.bal;
const pct = a.start > 0 ? Math.round((a.bal / a.start) * 100) : 0;
const card = document.createElement('div'); card.className = "card-container asset";
card.onclick = () => openModal(a.id, "asset");
card.innerHTML = <div class="card-header"><span>${a.name}</span><span style="color:#0284c7;">$${Math.round(a.bal)}</span></div> <div class="card-meta">${a.apr} | Target: $${a.start}</div> <div class="bar-wrapper"><div class="bar-fill" style="width:${Math.min(pct, 100)}%;"></div></div>;
aBox.appendChild(card);
});
// Flows
const fBox = document.getElementById('flows-box'); fBox.innerHTML = '';
flows.forEach(f => {
const card = document.createElement('div'); card.className = "card-container flow";
card.onclick = () => openModal(f.id, "flow");
card.innerHTML = <div class="card-header"><span>${f.name}</span><span style="color:#a855f7;">YTD: $${f.bal}</span></div> <div class="card-meta">${f.apr}</div>;
fBox.appendChild(card);
});
const netWorth = totalAssets - totalDebts;
const nwDisplay = document.getElementById('nw-display');
nwDisplay.innerText = (netWorth >= 0 ? "+$" : "-$") + Math.abs(netWorth).toLocaleString();
nwDisplay.style.color = netWorth >= 0 ? "#10b981" : "#ef4444";
localStorage.setItem('grid_debts', JSON.stringify(debts));
localStorage.setItem('grid_assets', JSON.stringify(assets));
localStorage.setItem('grid_flows', JSON.stringify(flows));
}
function openModal(id, type) {
activeId = id; activeType = type;
let d = type === "debt" ? debts.find(x=>x.id===id) : type === "asset" ? assets.find(x=>x.id===id) : flows.find(x=>x.id===id);
document.getElementById('m-title').innerText = d.name;
document.getElementById('pay-amount').value = '';
document.getElementById('pay-date').value = new Date().toISOString().split('T')[0];
document.getElementById('due-day-group').style.display = type === "asset" ? 'none' : 'block';
if(type !== "asset") document.getElementById('pay-due-day').value = d.dueDay;
const hList = document.getElementById('history-list'); hList.innerHTML = '';
d.history.forEach(h => {
hList.innerHTML += <div class="history-item"><span>${h.date}</span><span>$${h.amt} <button class="del-btn" onclick="deleteItem(event, '${h.id}')">&times;</button></span></div>;
});
document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function deleteItem(e, hid) {
e.stopPropagation();
let d = activeType === "debt" ? debts.find(x=>x.id===activeId) : activeType === "asset" ? assets.find(x=>x.id===activeId) : flows.find(x=>x.id===activeId);
const idx = d.history.findIndex(h => h.id === hid);
if(idx > -1) {
if(activeType === "debt") d.bal += d.history[idx].amt;
else d.bal -= d.history[idx].amt;
d.history.splice(idx, 1);
renderGrid(); closeModal();
}
}
function submitForm() {
const amt = parseFloat(document.getElementById('pay-amount').value);
const date = document.getElementById('pay-date').value;
let d = activeType === "debt" ? debts.find(x=>x.id===activeId) : activeType === "asset" ? assets.find(x=>x.id===activeId) : flows.find(x=>x.id===activeId);
if(activeType !== "asset") {
const nd = parseInt(document.getElementById('pay-due-day').value);
if(nd >= 1 && nd <= 31) d.dueDay = nd;
}
if(amt && amt > 0 && date) {
if(activeType === "debt") d.bal = Math.max(0, d.bal - amt);
else d.bal += amt;
d.history.unshift({ id: Date.now().toString(), date, amt });
}
renderGrid(); closeModal();
}
renderGrid();
