<!DOCTYPE html>
<html lang="en">
<head>
    <!-- CRITICAL CHARACTER ENCODING FIX FOR MOJIBAKE GLITCHES -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Automation Matrix Dashboard</title>
    
    <!-- Clean, semantic structural styles matching your layout preferences -->
    <style>
        :root {
            --bg-primary: #0f1319;
            --bg-secondary: #161b22;
            --border-color: #21262d;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --input-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px; /* Clean, modern mobile viewport constraints */
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .matrix-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .form-group-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group.no-margin {
            margin-bottom: 0;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 12px; /* Touch-friendly element sizing */
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #58a6ff;
        }

        /* Submit Action Styling */
        .btn-action {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn-action:hover {
            background-color: var(--accent-green-hover);
        }

        /* Ledger table viewport alignment adjustments */
        .ledger-wrapper {
            overflow-x: auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">

        <!-- Module 1: Hybrid Automation Matrix -->
        <section class="matrix-card">
            <div class="card-header">
                <span>ð</span> Hybrid Automation Matrix
            </div>
            
            <div class="form-group">
                <label for="targetNode">Target Workspace Node</label>
                <select id="targetNode">
                    <option value="" disabled selected>Select Workspace...</option>
                </select>
            </div>

            <div class="form-group-row">
                <div class="form-group no-margin">
                    <label for="transAmount">Transaction Amount</label>
                    <input type="number" id="transAmount" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group no-margin">
                    <label for="triggerDate">Trigger Date</label>
                    <input type="date" id="triggerDate">
                </div>
            </div>

            <div class="form-group">
                <label for="recurrence">Recurrence Cycle</label>
                <select id="recurrence">
                    <option value="one-time">One-Time Event</option>
                    <option value="weekly">Weekly</option>
                    <option value="biweekly">Bi-Weekly</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>

            <button type="button" class="btn-action">Dispatch Automation Matrix</button>
        </section>

        <!-- Module 2: Provision New Node Account -->
        <section class="matrix-card">
            <div class="card-header">
                <span>ð³</span> Provision New Node Account
            </div>

            <div class="form-group">
                <label for="frameTitle">Account Frame Title</label>
                <input type="text" id="frameTitle" placeholder="e.g. Ally Savings, Discover Card">
            </div>

            <div class="form-group">
                <label for="classClass">Classification Class</label>
                <select id="classClass">
                    <option value="avalanche-liability">Avalanche Liability Node</option>
                    <option value="asset-node">Asset Deployment Node</option>
                </select>
            </div>

            <div class="form-group-row">
                <div class="form-group no-margin">
                    <label for="currentBalance">Stated Current Balance</label>
                    <input type="number" id="currentBalance" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group no-margin">
                    <label for="rateParam">Stated Rate Parameter (APR %)</label>
                    <input type="text" id="rateParam" placeholder="e.g. 24.99 or Fixed">
                </div>
            </div>

            <button type="button" class="btn-action">Deploy Active Node Entry</button>
        </section>

        <!-- Module 3: Unified Transaction Ledger Log -->
        <section class="matrix-card">
            <div class="card-header">
                <span>ð°</span> Unified Transaction Ledger Log
            </div>
            
            <div class="ledger-wrapper">
                <!-- Ledger items can be injected dynamically here -->
            </div>
            
            <button type="button" class="btn-action" style="background-color: #21262d; border: 1px solid var(--border-color);">
                Export Spreadsheet Backup
            </button>
        </section>

    </div>

</body>
</html>
