<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Worth Control Grid</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #f8fafc; padding: 15px; max-width: 900px; margin: 0 auto; padding-bottom: 50px; }
        h1 { text-align: center; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        .nw-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .nw-title { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .nw-val { font-size: 32px; font-weight: bold; color: #10b981; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid-layout { grid-template-columns: 1fr 1fr; } }
        
        .column-box { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .column-title { font-size: 14px; font-weight: bold; color: #38bdf8; text-transform: uppercase; border-bottom: 1px solid #374151; padding-bottom: 8px; margin-bottom: 15px; letter-spacing: 1px; }
        
        .card-container { background: #1f2937; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #374151; border-left: 4px solid #ef4444; cursor: pointer; transition: all 0.2s ease; }
        .card-container:hover { background: #2d3748; border-color: #4a5568; }
        .card-container.wiped { border-left-color: #10b981; opacity: 0.7; }
        .card-container.asset { border-left-color: #0284c7; }
        .card-container.flow { border-left-color: #a855f7; }
        
        .card-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .card-meta { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        
        .bar-wrapper { background: #030712; border-radius: 6px; height: 8px; overflow: hidden; border: 1px solid #374151; margin-bottom: 4px; }
        .bar-fill { background: linear-gradient(90deg, #ef4444, #f43f5e); height: 100%; width: 100%; transition: width 0.4s ease; }
        .card-container.wiped .bar-fill { width: 0% !important; }
        .card-container.asset .bar-fill { background: linear-gradient(90deg, #0284c7, #38bdf8); }
        .card-container.flow .bar-fill { background: linear-gradient(90deg, #7c3aed, #a855f7); }
        .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #1f2937; border: 1px solid #374151; border-radius: 16px; width: 100%; max-width: 440px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #374151; padding-bottom: 8px; }
        .modal-title { font-weight: bold; color: #38bdf8; font-size: 16px; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #030712; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #0284c7, #38bdf8); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .history-section { margin-top: 15px; border-top: 1px solid #374151; padding-top: 10px; max-height: 100px; overflow-y: auto; font-size: 13px; }
        .history-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(55, 65, 81, 0.4); }
        .del-btn { background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 16px; line-height: 1; padding-left: 5px; }
    </style>
</head>
<body>

    <h1>Net Worth Grid Engine</h1>
    <div class="subtitle">Asset, Liability, & Support Control Room</div>
    
    <div class="nw-box">
        <div class="nw-title">Calculated Global Net Worth</div>
        <div class="nw-val" id="nw-display">$0</div>
    </div>

    <div class="grid-layout">
        <div class="column-box">
            <div class="column-title">🏦 Wealth Generation Assets</div>
            <div id="assets-box"></div>
            
            <div class="column-title" style="margin-top:25px;">🤝 Capital Support Flow</div>
            <div id="flows-box"></div>
        </div>
        
        <div class="column-box">
            <div class="column-title">💰 Avalanche Liabilities</div>
            <div id="debts-box"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="m-title">Account Details</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group" id="due-day-group">
                <label id="due-label">Monthly Due Date Day</label>
                <input type="number" id="pay-due-day" min="1" max="31">
            </div>
            <div class="form-group">
                <label id="amt-label">Log Transaction Amount ($)</label>
                <input type="number" id="pay-amount" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="pay-date">
            </div>
            <button class="submit-btn" onclick="submitForm()">Save Metrics</button>
            <div class="history-section" id="history-list"></div>
        </div>
    </div>

    <!-- THIS LINK RUNS YOUR SECOND FILE -->
    <script src="script.js"></script>
</body>
</html>
